name: CasinoCore
version: '${project.version}'
main: pl.kurdeslawo.casinocore.CasinoCorePlugin
api-version: '26.2'
description: Casino foundation with a pluggable economy and Roulette assets.
author: kurdeslawo-stack
website: https://github.com/kurdeslawo-stack/kasyno
softdepend: [Vault]

commands:
  casino:
    description: CasinoCore player and administration commands.
    usage: /casino [reload|balance|coins|roulette]
    permission: casinocore.command

permissions:
  casinocore.command:
    description: Allows access to the base /casino command.
    default: true
  casinocore.admin:
    description: Allows CasinoCore configuration and test economy administration.
    default: op
    children:
      casinocore.roulette.open: true
      casinocore.roulette.manage: true
  casinocore.roulette.open:
    description: Allows opening the Roulette GUI with /casino roulette open.
    default: false
  casinocore.roulette.manage:
    description: Allows creating and removing Roulette interaction hitboxes.
    default: false
