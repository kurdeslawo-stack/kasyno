        normal: {material: LIME_WOOL, cmd: 0}
        selected: {material: LIME_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '1':
        normal: {material: RED_WOOL, cmd: 0}
        selected: {material: RED_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '2':
        normal: {material: BLACK_WOOL, cmd: 0}
        selected: {material: BLACK_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '3':
        normal: {material: RED_WOOL, cmd: 0}
        selected: {material: RED_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '4':
        normal: {material: BLACK_WOOL, cmd: 0}
        selected: {material: BLACK_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '5':
        normal: {material: RED_WOOL, cmd: 0}
        selected: {material: RED_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '6':
        normal: {material: BLACK_WOOL, cmd: 0}
        selected: {material: BLACK_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '7':
        normal: {material: RED_WOOL, cmd: 0}
        selected: {material: RED_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '8':
        normal: {material: BLACK_WOOL, cmd: 0}
        selected: {material: BLACK_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '9':
        normal: {material: RED_WOOL, cmd: 0}
        selected: {material: RED_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
      '10':
        normal: {material: BLACK_WOOL, cmd: 0}
        selected: {material: BLACK_CONCRETE, cmd: 0}
        ball: {material: GLOWSTONE, cmd: 0}
        selected-ball: {material: SEA_LANTERN, cmd: 0}
    # Opcjonalne ikony Blackjacka, również bez namespace/resource packa CasinoCore.
    blackjack:
      background_felt:
        normal: {material: GRAY_STAINED_GLASS_PANE, cmd: 0}
      background_rail:
        normal: {material: GRAY_STAINED_GLASS_PANE, cmd: 0}
      card_back:
        normal: {material: PAPER, cmd: 0}
      # Indywidualne karty: np. ace_hearts.normal: {material: PAPER, cmd: 123}

blackjack:
  stakes: [1, 5, 25]
  rules:
    dealer-hits-soft-17: false
  payouts:
    blackjack-profit-numerator: 3
    blackjack-profit-denominator: 2
  animation:
    deal-delay-ticks: 5
    dealer-delay-ticks: 6
    result-duration-ticks: 50
  sounds:
    enabled: true
