# CasinoCore 1.0.0 production configuration.
roulette:
  # Available stakes shown in the GUI. The current layout supports up to three values.
  stakes:
    - 1
    - 5
    - 25

  # This release uses the fixed compact Roulette range 0-12.
  numbers:
    min: 0
    max: 12

  # Szanse numerów: większa WAGA = częstszy wynik. To nie jest procent wygranych.
  # 1 dla każdego numeru = poprzednie równe szanse 1/13.
  # Przykład: waga 2 przy pozostałych 1 daje 2/14 = 14.29% temu numerowi.
  # 0 wyłącza numer; co najmniej jeden numer musi mieć dodatnią wagę (maks. 1000000).
  # Zmiana wpływa na WSZYSTKIE zakłady. Częstszy numer może być opłacalny do obstawiania!
  # Admin: /casino chances roulette <numer> <waga> — zapisuje i stosuje bez restartu.
  odds:
    weights:
      '0': 1
      '1': 1
      '2': 1
      '3': 1
      '4': 1
      '5': 1
      '6': 1
      '7': 1
      '8': 1
      '9': 1
      '10': 1
      '11': 1
      '12': 1

  # Total return multipliers, including the original stake.
  payouts:
    outside: 2
    exact: 12

  # Animation timings in server ticks (20 ticks are approximately one second).
  animation:
    fast-delay-ticks: 2
    medium-delay-ticks: 3
    slow-delay-ticks: 5
    final-delay-ticks: 8
    final-pulse-delay-ticks: 4
    result-duration-ticks: 50

  # Animation/result sounds can be muted or balanced without changing GUI text.
  sounds:
    enabled: true
    tick-volume: 0.32
    final-volume: 0.95
    win-volume: 0.90

  # Hitbox settings for the existing Interaction entities.
  interaction:
    width: 2.75
    height: 1.5
    remove-radius: 4.0

economy:
  # Production: vault. Use local only for development; local balances are not persistent.
  provider: vault
  local:
    starting-balance: 0

blackjack:
  stakes:
    - 1
    - 5
    - 25
  rules:
    # false: standard — krupier stoi na miękkim 17 (as + 6).
    # true: H17 — krupier dobiera na miękkim 17. Zmienia szanse wynikające z zasad.
    # Admin: /casino chances blackjack standard | /casino chances blackjack h17
    # Brak stałego procentu wygranych: wynik zależy też od strategii i kart.
    dealer-hits-soft-17: false
  payouts:
    # Zysk za naturalnego blackjacka: 3/2 = +150% stawki, 1/1 = +100% stawki.
    # Zmienia kwotę wygranej, nie prawdopodobieństwo jej wystąpienia.
    # Ułamki zaokrąglane w dół. Zwykła wygrana nadal x2, remis zwraca stawkę.
    blackjack-profit-numerator: 3
    blackjack-profit-denominator: 2
  animation:
    deal-delay-ticks: 5
    dealer-delay-ticks: 6
    result-duration-ticks: 50
  sounds:
    enabled: true
