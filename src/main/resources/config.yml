# CasinoCore 1.1.0 — konfiguracja Laina. Bez własnego resource packa i mebli.
config-version: 2

economy:
  # vault wymaga Vault oraz aktywnego providera ekonomii; brak = wyłączenie pluginu.
  # local to wyłącznie testy; saldo znika przy restarcie.
  provider: vault
  local:
    starting-balance: 0

roulette:
  # Kwoty w walucie serwera, maksymalnie dwie cyfry po przecinku.
  # Kliknięcie kwoty OD RAZU rozpoczyna rundę dla zaznaczonego zakładu.
  stakes: [1, 5, 25]
  # Zakres na stałe 0–10. Każdy numer ma zawsze szansę 1/11.
  # Czerwone: 1,3,5,7,9. Czarne: 2,4,6,8,10. Zero nie wygrywa zakładów zewnętrznych.
  payouts:
    # Całkowity zwrot razem ze stawką. 1 ₭ x 1.8 = 1.80 ₭, bez obcinania ułamka.
    outside: 1.8
    exact: 8
  animation:
    fast-delay-ticks: 2
    medium-delay-ticks: 3
    slow-delay-ticks: 5
    final-delay-ticks: 8
    final-pulse-delay-ticks: 4
    result-duration-ticks: 50
  sounds:
    enabled: true
    tick-volume: 0.32
    final-volume: 0.95
    win-volume: 0.90
  # Kolory & i pogrubienie &l można ustawić dla każdego tekstu menu.
  text:
    title: '&5Ruletka'
    number: '&e{number}'
    stake: '&e{amount}₭'
    history: '&eHistoria'
    history-loss: '&c-{stake}₭'
    history-win: '&f-{stake}₭ + {payout}₭ = &a{net}₭'
    history-partial-loss: '&f-{stake}₭ + {payout}₭ = &c{net}₭'
    history-push: '&f-{stake}₭ + {payout}₭ = &7{net}₭'
    exact-bet: '&fNumer {number}'
    no-history: '&7Brak rozegranych rund.'
    balance: '&e{amount}₭'
    balance-error: '&cSaldo niedostępne'
    close: '&cZamknij'
    ready: '&eRuletka'
    select-help: '&7Wybierz zakład, a następnie kliknij kwotę.'
    choose-bet: '&cNajpierw wybierz zakład.'
    selected-bet: '&7Zakład: &f{bet}'
    stake-start: '&aKliknij, aby zagrać'
    selected: '&aWybrano'
    select: '&aKliknij, aby wybrać'
    chance: '&7Szansa: &f{chance}%'
    payout: '&7Wypłata: &ex{multiplier}'
    ball: '&ePiłka wskazuje ten numer'
    spinning: '&e&lKOŁO SIĘ KRĘCI...'
    wait: '&7Poczekaj na wynik'
    result-wait: '&7Poczekaj na zakończenie rundy'
    win: '&a&lWYGRANA!'
    loss: '&c&lPRZEGRANA'
    result: '&7Wynik: {number}'
    won: '&7Wygrana: &e{amount}₭'
    lost: '&7Stracono: &e{amount}₭'
    review: '&cWymagana weryfikacja'
    contact-admin: '&7Skontaktuj się z administracją'
    bets:
      red: '&cCzerwone'
      black: '&8Czarne'
      low: '&eNiskie 1–5'
      high: '&eWysokie 6–10'
    condition:
      exact_number: '&7Wygrywasz, jeśli wypadnie wybrany numer.'
      red: '&7Wygrywasz, jeśli wypadnie czerwony numer.'
      black: '&7Wygrywasz, jeśli wypadnie czarny numer.'
      low: '&7Wygrywasz, jeśli wypadnie numer od 1 do 5.'
      high: '&7Wygrywasz, jeśli wypadnie numer od 6 do 10.'

# Ikony korzystają wyłącznie z materiałów i CMD paczki właściciela serwera.
# cmd: 0 = zwykły item Minecrafta. Ustaw odpowiedni materiał i CMD z paczki Lainy.
# Każdy stan ma własne CMD. Brak stanu dziedziczy konfigurację normal.
# normal / selected / ball / selected-ball to CZTERY niezależne stany numeru.
# CMD to nieujemna liczba całkowita do 16777216 (dokładny zakres komponentu float).
gui:
  icons:
    background:
      normal: {material: GRAY_STAINED_GLASS_PANE, cmd: 0}
    balance:
      normal: {material: SUNFLOWER, cmd: 0}
    history:
      normal: {material: BOOK, cmd: 0}
    close:
      normal: {material: BARRIER, cmd: 0}
    status:
      normal: {material: PAPER, cmd: 0}
      spinning: {material: CLOCK, cmd: 0}
      win: {material: EMERALD, cmd: 0}
      loss: {material: REDSTONE, cmd: 0}
      error: {material: BARRIER, cmd: 0}
    stakes:
      '0':
        normal: {material: GOLD_NUGGET, cmd: 0}
      '1':
        normal: {material: GOLD_NUGGET, cmd: 0}
      '2':
        normal: {material: GOLD_NUGGET, cmd: 0}
    outside:
